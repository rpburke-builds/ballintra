<style>
:root{
  /* Brand palette — Ballintra Brand Foundation, Aug 2026 */
  --ink:#16232E;
  --navy:#1F3A5F;        /* Ballintra Navy — primary */
  --paper:#F4EFE4;       /* Cream — ground */
  --paper-2:#EAE3D5;
  --gold:#C9A227;        /* Brand gold — accent on navy / non-text rules only (2.1:1 on cream) */
  --brass:#7E6115;       /* Gold-ink — accessible gold for text & underlines on cream (5.1:1) */
  --stone:#8A8577;       /* Brand stone — decorative rules */
  --muted:#6B675C;       /* Secondary text, warm stone family (4.9:1) */
  --rule:#DDD5C6;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --col:minmax(0,1fr);

  /* Hero mark watermark — nudge these 3 numbers, then refresh the browser.
     No other edits needed to reposition or resize the mark. */
  --mark-size: 240px;   /* overall width of the watermark; height follows automatically */
  --mark-right: -30px;  /* horizontal position — negative moves it further right/off-edge */
  --mark-opacity: .07;  /* how visible it is — 0 = invisible, 1 = full solid color */
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  border-top:3px solid var(--gold);
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

.wrap{max-width:1180px;margin:0 auto;padding:0 40px;}

.sheet{
  display:grid;
  grid-template-columns:140px var(--col);
  gap:48px;
  padding:88px 0;
  border-top:1px solid var(--rule);
}
.sheet:first-of-type{border-top:none;}
.runhead{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  padding-top:10px;
}
.runhead span{display:block;color:var(--brass);margin-bottom:6px;}

nav{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  padding:28px 0 26px;
  border-bottom:1px solid var(--rule);
}
.mark{
  display:inline-flex;
  align-items:center;
  gap:.55em;
  font-family:var(--display);
  font-size:21px;
  letter-spacing:.22em;
  text-decoration:none;
  color:var(--navy);
  font-weight:500;
}
.mark-glyph{
  height:1.05em;
  width:auto;
  flex:none;
  display:block;
  fill:var(--navy);
  transform:translateY(-.02em);
}
.nav-links{display:flex;gap:30px;}
.nav-links a{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--muted);
  padding-bottom:3px;
  border-bottom:1px solid transparent;
  transition:color .18s ease,border-color .18s ease;
}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--ink);border-color:var(--brass);}

/* Menu button: 44px tap target; bars are centred and offset with
   transforms so the ✕ always crosses exactly in the middle. */
.nav-toggle{
  display:none;
  position:relative;
  background:none;border:none;cursor:pointer;
  width:44px;height:44px;padding:0;margin-right:-10px;
  -webkit-tap-highlight-color:transparent;
}
.nav-toggle span{
  position:absolute;left:12px;right:12px;top:50%;
  height:1.5px;margin-top:-.75px;
  background:var(--ink);
  transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .18s ease;
}
.nav-toggle span:nth-child(1){transform:translateY(-6px) rotate(0);}
.nav-toggle span:nth-child(3){transform:translateY(6px) rotate(0);}
.nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(0) rotate(45deg);}
.nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0;}
.nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(0) rotate(-45deg);}

@media (max-width:820px){

  form{max-width:560px;margin-top:8px;}

  form input:focus,form textarea:focus{outline:none;border-bottom-color:var(--brass);}

  .stat .cap a{color:var(--muted);border-bottom:1px solid var(--rule);text-decoration:none;}
  .stat .cap a:hover{color:var(--ink);border-color:var(--brass);}
  .refs{margin-top:8px;}

  .refs a{color:var(--ink);border-bottom:1px solid var(--rule);text-decoration:none;}
  .refs a:hover{border-color:var(--brass);color:var(--brass);}
  .page{display:none;}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease, transform .7s ease;}
.reveal.in{opacity:1;transform:translateY(0);}

/* Hover accent on interactive rows */
.entry{transition:background .25s ease;margin:0 -28px;padding:34px 28px;border-radius:2px;}
.entry:hover{background:var(--paper-2);}
.entry:hover h3{color:var(--brass);transition:color .2s ease;}
.entry h3{transition:color .2s ease;}
.stat{transition:transform .3s ease;}
.stat:hover .fig{color:var(--brass);transition:color .25s ease;}
.stat .fig{transition:color .25s ease;}

/* ---- Ascent: animated header device (interior pages) ---- */
.hero{isolation:isolate;overflow-x:clip;}
.ascent{position:absolute;z-index:-1;right:0;top:96px;transform:translateX(26%);height:calc(100% - 95.5px);width:auto;aspect-ratio:160/164.4;overflow:visible;pointer-events:none;fill:none;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 58%);mask-image:linear-gradient(to right,transparent 0%,#000 58%);}
.ascent .ring{opacity:0;animation:ascent-rise 700ms cubic-bezier(.22,.61,.36,1) calc(var(--i)*140ms + 200ms) forwards;}
.ascent polygon{stroke:#7E6115;stroke-width:1.2;stroke-opacity:var(--o);vector-effect:non-scaling-stroke;stroke-linejoin:miter;animation:ascent-pulse 9s ease-out calc(1800ms + var(--i)*650ms) 3 both;}
@keyframes ascent-rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@keyframes ascent-pulse{0%,22%,100%{stroke:#7E6115;stroke-opacity:var(--o);}8%{stroke:#C9A227;stroke-opacity:.85;}}
@media (max-width:820px){.ascent{right:-24px;transform:none;top:auto;bottom:-1px;height:min(calc(100% - 63px),200px);opacity:.45;}}
@media (prefers-reduced-motion:reduce){.ascent .ring{opacity:1;animation:none;}.ascent polygon{animation:none;}}
</style>
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>

<script>
var navLinks = document.getElementById('nav-links');
var navToggle = document.querySelector('.nav-toggle');
if(navToggle){
  navToggle.addEventListener('click', function(){
    var open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}

var revealEls = document.querySelectorAll('.reveal');
if('IntersectionObserver' in window && revealEls.length){
  var revealObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('in');
        revealObserver.unobserve(entry.target);
      }
    });
  }, {threshold:0.15, rootMargin:'0px 0px -40px 0px'});
  revealEls.forEach(function(el){ revealObserver.observe(el); });
} else {
  revealEls.forEach(function(el){ el.classList.add('in'); });
}

// Campaign attribution: remember UTM tags for this visit (session only,
// no cookies) so the contact form can include them in the submission.
(function(){
  var KEY = 'ballintra_attribution';
  var FIELDS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
  var store;
  try { store = window.sessionStorage; store.getItem(KEY); } catch(e){ return; }
  try {
    var q = new URLSearchParams(location.search), tags = {}, has = false;
    FIELDS.forEach(function(k){
      var v = q.get(k);
      if(v){ tags[k] = v.slice(0,100); has = true; }
    });
    var ref = document.referrer;
    var external = ref && ref.indexOf(location.host) === -1 ? ref.slice(0,200) : '';
    if(has){
      tags.landing_page = location.pathname;
      if(external) tags.external_referrer = external;
      store.setItem(KEY, JSON.stringify(tags));
    } else if(!store.getItem(KEY)){
      var first = { landing_page: location.pathname };
      if(external) first.external_referrer = external;
      store.setItem(KEY, JSON.stringify(first));
    }
    var form = document.querySelector('form[name="contact"]');
    if(form){
      var saved = JSON.parse(store.getItem(KEY) || '{}');
      Object.keys(saved).forEach(function(k){
        var input = form.querySelector('input[type="hidden"][name="' + k + '"]');
        if(input) input.value = saved[k];
      });
    }
  } catch(e){}
})();
</script>
